services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
  poker:
    build: .
    ports:
      - '8080:8080'
    environment:
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      BASE_PATH: ${BASE_PATH:-}
      WEB_DIST: /app/platform/web/dist
    depends_on:
      - redis
