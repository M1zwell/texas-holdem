# Do not rewrite /api/* to /.netlify/functions/api/:splat — that turns
# /api/health into /.netlify/functions/api/health (404). The function's
# config.path already binds /api/* and /poker/api/* to handlePokerApi.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
