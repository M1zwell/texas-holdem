# jubuddy.com/poker  — mount this location on the existing jubuddy host
# m1z.gg             — use the same upstream at / (omit the /poker prefix)

upstream jub_poker {
    server poker:8080;
}

server {
    listen 80;
    server_name jubuddy.com www.jubuddy.com;

    location /poker/socket.io/ {
        proxy_pass http://jub_poker/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /poker/ {
        proxy_pass http://jub_poker/poker/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name m1z.gg www.m1z.gg;

    location /socket.io/ {
        proxy_pass http://jub_poker/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://jub_poker/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
