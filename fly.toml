# OPTIONAL fallback. Preferred production path is Cloudflare Workers
# (cloudflare/wrangler.jsonc → jubuddy.com/poker). Use Fly only if you need
# always-on Socket.IO timers on a VM.
#
#   fly launch --copy-config --no-deploy
#   fly secrets set JWT_SECRET=... SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=...
#   fly deploy
#
# Hands hydrate from Supabase, so this optional VM may scale to zero.
# Creating the app is still blocked while Fly invoices are overdue.

app = "jub-poker"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  BASE_PATH = "/poker"
  PUBLIC_URL = "https://jubuddy.com"
  SUPABASE_URL = "https://kiztaihzanqnrcrqaxsv.supabase.co"
  VITE_SUPABASE_URL = "https://kiztaihzanqnrcrqaxsv.supabase.co"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

[[http_service.checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
